name: ci
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          
      - name: Verify Go installation
        shell: bash
        run: |
          go version
          go env GOOS GOARCH
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          
      - name: Update Go modules
        shell: bash
        run: |
          echo "Updating go modules..."
          go mod tidy || echo "go mod tidy failed, continuing anyway"
          go mod download || echo "go mod download failed, continuing anyway"
          
      - name: Install libx11-dev for clipboard support
        if: runner.os == 'Linux'
        run: sudo apt install libx11-dev

      - name: Build
        shell: bash
        run: |
          set -e
          echo "Building for ${{ runner.os }} ${{ runner.arch }}"
          go build -tags noaudio -ldflags "-s -w" .
          echo "Build completed successfully"
          ls -la discordo*

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        with:
          name: discordo_${{ runner.os }}_${{ runner.arch }}
          path: |
            discordo
            discordo.exe

      - name: Send repository dispatch
        if: ${{ runner.os == 'Windows' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -f "event_type=discordo-ci-completed" /repos/vvirtues/bucket/dispatches
